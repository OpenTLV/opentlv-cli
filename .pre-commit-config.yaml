# Third-party and generated sources retain their own formatting and notices.
exclude: (^|/)(vendor|third_party|generated|build[^/]*|\.venv)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        types: [text]
        exclude: '(?i:\.(bin|dat)$)|^tests/fixtures/binary/'
      - id: end-of-file-fixer
        types: [text]
        exclude: '(?i:\.(bin|dat)$)|^tests/fixtures/binary/'
      - id: check-yaml
      - id: check-json
      - id: check-ast
      - id: check-added-large-files
        args: [--enforce-all]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.1
    hooks:
      - id: clang-format
        args: [-i]
        types_or: [c, c++]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        types: [markdown, text]
        args: [--fix, --config, .markdownlint.json]

  - repo: https://codeberg.org/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        additional_dependencies: ['reuse[charset-normalizer]==6.2.0']
