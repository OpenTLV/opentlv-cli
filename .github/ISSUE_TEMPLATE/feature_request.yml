name: Feature request
description: Propose a CLI feature or development improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem should this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed functionality
      description: Describe the behavior and CLI ownership boundary.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes and required validation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context
