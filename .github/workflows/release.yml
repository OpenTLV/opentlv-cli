name: CLI release gate

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character CLI commit SHA already on main
        required: true
        type: string
      tag:
        description: New CLI SemVer tag (for example v0.1.0 or v0.1.0-rc.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cli-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.request.outputs.cli_sha }}
    steps:
      # Release orchestration comes from main; candidate code runs only in read-only jobs.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify exact commit, new tag and pinned dependencies
        id: request
        env:
          CANDIDATE_SHA: ${{ inputs.commit }}
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: >-
          python -B scripts/release.py prepare --sha "$CANDIDATE_SHA" --tag "$CANDIDATE_TAG"
          --output build/release/request.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-request-${{ github.run_attempt }}
          path: build/release/request.json
          if-no-files-found: error

  validation:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        shared: ['ON', 'OFF']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: release-request-${{ github.run_attempt }}
          path: build/release
      - name: Full dependency and command validation
        run: >-
          python -B tests/check_core_dependency.py --shared ${{ matrix.shared }}
          --release-request build/release/request.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.shared }}
          path: |
            build/dependency-check/**/summary.json
            build/dependency-check/**/*.log
            build/dependency-check/**/ctest.xml
            build/dependency-check/**/cli-version.txt
            build/dependency-check/**/baseline-report.json
            build/dependency-check/**/query-report.json
          if-no-files-found: error

  quality:
    needs: prepare
    uses: ./.github/workflows/quality.yml
    with:
      revision: ${{ needs.prepare.outputs.sha }}

  release:
    needs: [prepare, validation, quality]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: release-request-${{ github.run_attempt }}
          path: build/release
      - uses: actions/download-artifact@v4
        with:
          pattern: release-evidence-${{ github.run_attempt }}-*
          path: build/release/evidence
      - name: Reject incomplete or inconsistent release evidence
        run: >-
          python -B scripts/release.py aggregate --request build/release/request.json
          --evidence build/release/evidence --output build/release/result.json
      - name: Require every validation and quality job
        if: always()
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: >-
          python -B scripts/release.py finalize --output build/release/result.json
          --validation "$VALIDATION_RESULT" --quality "$QUALITY_RESULT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-result-${{ github.run_attempt }}
          path: build/release/result.json
          if-no-files-found: error
      - name: Bind tag authorization to this request and run
        env:
          CANDIDATE_SHA: ${{ inputs.commit }}
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: >-
          python -B scripts/release.py authorize --result build/release/result.json
          --sha "$CANDIDATE_SHA" --tag "$CANDIDATE_TAG" --output build/release/tag.json
      - name: Create tag at the validated commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = JSON.parse(fs.readFileSync('build/release/tag.json', 'utf8'));
            // Create only: an existing tag or a racing creator fails; never move a tag.
            await github.rest.git.createRef({
              ...context.repo, ref: tag.ref, sha: tag.sha
            });
            await core.summary.addRaw(`Created ${tag.ref} at ${tag.sha}.\n`).write();
