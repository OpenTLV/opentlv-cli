name: CLI release gate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag (v0.2.0 or v0.2.0-rc.1); closed changelog heading omits v
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.tag }}
concurrency:
  # CLI versioning forbids two version tags on one commit, even with different names.
  group: cli-release
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lock dispatch commit, closed changelog and Core dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/cli_ci.py preflight --output build/release/request.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-request-${{ github.run_attempt }}
          path: build/release/request.json
          if-no-files-found: error

  full:
    needs: candidate
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/cli-full.yml
    with:
      release_tag: ${{ inputs.tag }}

  binaries:
    needs: full
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Same-run, same-attempt Full workers package the exact executable they
      # tested. This job only signs those bytes after the complete gate passes.
      - uses: actions/download-artifact@v4
        with:
          name: cli-tested-package-${{ matrix.os }}-${{ github.run_attempt }}
          path: build/artifacts
      - uses: actions/attest@v4
        with:
          subject-path: build/artifacts/*
          create-storage-record: false
      - uses: actions/upload-artifact@v4
        with:
          name: release-binary-${{ matrix.os }}-${{ github.run_attempt }}
          path: build/artifacts/*
          if-no-files-found: error

  publish:
    needs: [candidate, full, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-request-${{ github.run_attempt }}
          path: build/request
      - uses: actions/download-artifact@v4
        with:
          name: cli-quality-full-${{ github.sha }}-${{ github.run_attempt }}
          path: build/quality
      - uses: actions/download-artifact@v4
        with:
          pattern: release-evidence-${{ github.run_attempt }}-*
          path: build/evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: release-binary-*-${{ github.run_attempt }}
          path: build/evidence
      - name: Bind verified packages to this candidate and Full CI attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B scripts/cli_ci.py assemble --request build/request/request.json
          --quality build/quality/cli-quality.json --evidence build/evidence --output build/publish
      - uses: actions/attest@v4
        with:
          subject-path: |
            build/publish/release-manifest.json
            build/publish/SHA256SUMS
          create-storage-record: false
      - name: Verify producer attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in build/publish/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
          done
      - name: Publish without replacing tags or assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "$GITHUB_SHA:refs/tags/$RELEASE_TAG"
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" build/publish/* --verify-tag \
            --title "OpenTLV CLI $RELEASE_TAG" --notes-file build/release-notes.md "${flags[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-result-${{ github.run_attempt }}
          path: build/result.json
          if-no-files-found: error

  timings:
    name: CLI release timings
    if: always()
    needs: [candidate, full, binaries, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/ci_timings.py --output build/ci-timings.json
      - uses: actions/upload-artifact@v4
        with:
          name: cli-release-timings-${{ github.sha }}-${{ github.run_attempt }}
          path: build/ci-timings.json
          if-no-files-found: error
