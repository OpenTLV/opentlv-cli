name: CLI Pull Request CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
  security-events: write
concurrency:
  group: cli-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/cli-checks.yml
    with:
      full: false

  timings:
    name: CLI pr timings
    if: always()
    needs: [checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/ci_timings.py --scope cli --output build/ci-timings.json
      - uses: actions/upload-artifact@v4
        with:
          name: cli-pr-timings-${{ github.sha }}-${{ github.run_attempt }}
          path: build/ci-timings.json
          if-no-files-found: error
