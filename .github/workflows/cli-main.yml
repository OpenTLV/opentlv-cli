name: CLI Main CI
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cli-main-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-26.04
    env:
      CC: gcc-15
      CXX: g++-15
      OPENTLV_CLI_DOWNLOAD_CACHE: ${{ github.workspace }}/.cache/core-downloads
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/core-downloads
          key: core-downloads-v1-${{ runner.os }}-Release-${{ hashFiles('cmake/core-artifact.json') }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/cli_build.py --build build/main --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: cli-dependencies-${{ github.sha }}-${{ github.run_attempt }}
          path: build/main/build-evidence.json
          if-no-files-found: error
  dependencies:
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cli-dependencies-${{ github.sha }}-${{ github.run_attempt }}
          path: build/dependencies
      - name: Publish verified Main dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B scripts/dependency_snapshot.py --evidence build/dependencies/build-evidence.json
          --output build/dependencies/snapshot.json --submit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-dependency-submission-${{ github.sha }}-${{ github.run_attempt }}
          path: build/dependencies/
          if-no-files-found: error
  gate:
    name: CLI quality gate
    if: always()
    needs: [smoke, dependencies]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python -B scripts/cli_ci.py gate --tier main --output build/cli-quality.json
      - uses: actions/upload-artifact@v4
        with:
          name: cli-quality-main-${{ github.sha }}-${{ github.run_attempt }}
          path: build/cli-quality.json
          if-no-files-found: error

  timings:
    name: CLI main timings
    if: always()
    needs: [gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/ci_timings.py --output build/ci-timings.json
      - uses: actions/upload-artifact@v4
        with:
          name: cli-main-timings-${{ github.sha }}-${{ github.run_attempt }}
          path: build/ci-timings.json
          if-no-files-found: error
