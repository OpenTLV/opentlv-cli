name: CLI quality

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Documentation notification contract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/quality
          node --test tests/test_docs_notification.cjs 2>&1 | tee build/quality/docs-notification.log
      - name: Formatting, syntax and license checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/quality
          pre-commit run --all-files 2>&1 | tee build/quality/pre-commit.log
      - name: C++ static analysis
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/check_static.py 2>&1 | tee build/quality/cppcheck.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-quality-${{ github.run_attempt }}
          path: build/quality/
          if-no-files-found: error
