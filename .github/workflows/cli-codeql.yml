name: CLI CodeQL
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        required: true
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang-18 ninja-build
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: ${{ inputs.full && 'security-extended' || '' }}
      - name: Compile the CLI and its required library dependency
        run: |
          cmake -S . -B build/codeql -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DOPENTLV_BUILD_TESTS=OFF -DOPENTLV_BUILD_EXAMPLES=OFF \
            -DOPENTLV_CLI_BUILD_TESTS=OFF -DFETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER
          cmake --build build/codeql --target otlv --parallel 2
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:cpp
