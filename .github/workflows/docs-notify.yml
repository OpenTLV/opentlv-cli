name: Notify CLI documentation portal

on:
  workflow_run:
    workflows: [CLI release gate]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: >-
      github.repository == 'OpenTLV/opentlv-cli' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.path == '.github/workflows/release.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      # No checkout or CLI code executes with the cross-repository credential.
      - uses: actions/download-artifact@v4
        with:
          name: release-result-${{ github.event.workflow_run.run_attempt }}
          path: evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Notify Docs of the validated CLI release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OPENTLV_DOCS_DISPATCH_TOKEN }}
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const result = JSON.parse(fs.readFileSync('evidence/result.json', 'utf8'));
            const request = result.request || {};
            if (result.status !== 'passed' || result.jobs?.validation !== 'success' ||
                result.jobs?.quality !== 'success' || request.workflow_sha !== run.head_sha ||
                request.run_id !== String(run.id) || request.run_attempt !== String(run.run_attempt) ||
                !/^[0-9a-f]{40}$/.test(request.cli_sha || '') ||
                !/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$/.test(request.tag || '') ||
                request.version !== request.tag.slice(1)) {
              throw new Error('Release evidence does not authorize this notification.');
            }
            await github.rest.repos.createDispatchEvent({
              owner: 'OpenTLV', repo: 'opentlv-docs', event_type: 'cli-docs-released',
              client_payload: {
                source: 'cli', repository: context.repo.owner + '/' + context.repo.repo,
                commit: request.cli_sha, ref: request.tag,
                run_id: run.id, run_attempt: run.run_attempt
              }
            });
