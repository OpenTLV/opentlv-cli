name: CLI development

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.os }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shared: 'ON'
          - os: windows-2022
            shared: 'OFF'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Configure pinned dependencies
        run: >-
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release
          -DOPENTLV_BUILD_SHARED_LIBS=${{ matrix.shared }}
          -DFETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER
      - name: Build CLI
        run: cmake --build build/ci --config Release --parallel 2
      - name: Run command and tooling tests
        run: ctest --test-dir build/ci -C Release --output-on-failure --no-tests=error --output-junit build/ci/ctest.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-tests-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.shared }}
          path: |
            build/ci/ctest.xml
            build/ci/cli-version.txt
            build/ci/tests/**/baseline-report.json
            build/ci/tests/**/query-report.json
          if-no-files-found: warn

  quality:
    uses: ./.github/workflows/quality.yml
    with:
      revision: ${{ github.sha }}
