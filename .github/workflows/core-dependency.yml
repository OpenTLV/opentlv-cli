name: Core dependency integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.os }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shared: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate all dependency modes
        run: python tests/check_core_dependency.py --shared ${{ matrix.shared }}
      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-dependency-${{ matrix.os }}-${{ matrix.shared }}
          path: |
            build/dependency-check/**/summary.json
            build/dependency-check/**/*.log
          if-no-files-found: warn

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: pre-commit run --all-files
